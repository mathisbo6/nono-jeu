const PONT_B64 = "PHNjcmlwdD4KKGZ1bmN0aW9uKCl7CiAgY29uc3QgdmVyc0NvcXVpbGxlID0gdmVycyA9PiB7CiAgICB0cnkgeyBwYXJlbnQucG9zdE1lc3NhZ2Uoe25vbm86ImFsbGVyIiwgdmVyczp2ZXJzfSwgIioiKTsgfSBjYXRjaChlKXt9CiAgfTsKICB3aW5kb3cuTk9OTyA9IHsgYWxsZXI6IHZlcnNDb3F1aWxsZSB9OwoKICBhZGRFdmVudExpc3RlbmVyKCJjbGljayIsIGUgPT4gewogICAgY29uc3QgZWwgPSBlLnRhcmdldC5jbG9zZXN0KCIucXVpdHRlciwgLmFsbGVyLWEsIC5qZXUgLnZpdGUsICNyZWpvaW5kcmVHcm91cGUiKTsKICAgIGlmKCFlbCkgcmV0dXJuOwoKICAgIGlmKGVsLm1hdGNoZXMoIi5xdWl0dGVyIikpIHsgdmVyc0NvcXVpbGxlKCJhY2N1ZWlsIik7IHJldHVybjsgfQoKICAgIC8qIFBhcnRpZSByYXBpZGUgOiBsZSBwcmVtaWVyIGFwcHVpIGRlcGxpZSBsZXMgcGFsaWVycywgaWwgbmUgbWVuZQogICAgICAgbnVsbGUgcGFydC4gU2V1bCBsJ2FwcHVpIHF1aSBzdWl0IHVuIHBhbGllciBjaG9pc2kgb3V2cmUgbGEKICAgICAgIHRhYmxlIOKAlCBjJ2VzdCBleGFjdGVtZW50IHF1YW5kIGxlIGJvdXRvbiBhZmZpY2hlICJSZWpvaW5kcmUiLiAqLwogICAgaWYoZWwubWF0Y2hlcygiLmpldSAudml0ZSIpKSB7CiAgICAgIGNvbnN0IGNhcnRlID0gZWwuY2xvc2VzdCgiLmpldSIpOwogICAgICBpZihjYXJ0ZSAmJiBjYXJ0ZS5jbGFzc0xpc3QuY29udGFpbnMoImNob2l4IikKICAgICAgICAgJiYgY2FydGUucXVlcnlTZWxlY3RvcigiLnBhbGllcnMgYnV0dG9uLm9uIikpIHsKICAgICAgICBzZXRUaW1lb3V0KCgpPT52ZXJzQ29xdWlsbGUoInRhYmxlIiksIDI2MCk7CiAgICAgIH0KICAgICAgcmV0dXJuOwogICAgfQogICAgc2V0VGltZW91dCgoKT0+dmVyc0NvcXVpbGxlKCJ0YWJsZSIpLCAyNjApOwogIH0sIHRydWUpOwp9KSgpOwo8L3NjcmlwdD4=";

const PAGES = { accueil:null, table:null };

/* atob rend des octets bruts, pas du texte. Sans TextDecoder, tous
   les accents des pages seraient abimes. */
function decoder(b64){
  const octets = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(octets);
}

function fabriquer(nom){
  // Le contenu d'un <template> vit dans .content, pas dans le noeud
  // lui-meme. On lit donc .content.textContent, avec repli sur
  // innerHTML pour les navigateurs qui ne suivent pas.
  const bloc = document.getElementById("src-" + nom);
  const b64  = ((bloc.content && bloc.content.textContent) || bloc.innerHTML || "").trim();
  if(!b64) throw new Error("bloc " + nom + " vide");
  let doc  = decoder(b64);
  const pont = decoder(PONT_B64);

  // Le pont se place a la toute fin du corps, donc apres le code de la
  // page : ses gestionnaires existent deja quand il s'installe.
  const fin = "</" + "body>";
  doc = doc.includes(fin) ? doc.replace(fin, pont + fin) : doc + pont;

  // Iframe sans src : elle reste sur about:blank, herite de l'origine
  // du parent, et accepte qu'on lui ecrive un document complet. C'est
  // ce qui fonctionne quand le fichier est ouvert en file://.
  const cadre = document.createElement("iframe");
  cadre.title = nom;
  document.body.appendChild(cadre);
  // contentDocument peut etre nul juste apres l'insertion selon le
  // navigateur ; contentWindow.document est le chemin le plus sur.
  const d = cadre.contentDocument
         || (cadre.contentWindow && cadre.contentWindow.document);
  if(!d) throw new Error("document de l'iframe " + nom + " inaccessible");
  d.open(); d.write(doc); d.close();
  return cadre;
}

/* Une panne de la coquille laissait un ecran noir muet — c'est ce qui
   rendait la v1 impossible a diagnostiquer sans ouvrir la console.
   Desormais l'erreur s'affiche dans la page. */
function panne(e){
  const v = document.getElementById("demarrage");
  v.classList.remove("parti");
  v.style.cssText += ";color:#ff6b6b;font:600 12px/1.6 ui-monospace,monospace;"
                   + "letter-spacing:0;padding:24px;text-align:left;white-space:pre-wrap";
  v.textContent = "NONO — la coquille n'a pas pu demarrer\n\n"
                + (e && e.stack ? e.stack : e);
}

function aller(nom){
  if(!(nom in PAGES)) nom = "accueil";
  // Les documents sont fabriques une seule fois et gardes en vie : on
  // ne fait que les montrer ou les cacher. Revenir a l'accueil retrouve
  // donc exactement l'etat qu'on y avait laisse.
  try { if(!PAGES[nom]) PAGES[nom] = fabriquer(nom); }
  catch(e) { panne(e); return; }
  for(const k in PAGES) if(PAGES[k]) PAGES[k].classList.toggle("visible", k === nom);
  if(location.hash.slice(1) !== nom) location.hash = nom;
  document.title = nom === "table" ? "NONO \u2014 table" : "NONO";
}

addEventListener("message", e => {
  const d = e.data;
  if(d && d.nono === "aller") aller(d.vers);
});
addEventListener("hashchange", ()=> aller(location.hash.slice(1)));

// Raccourci de mise au point : Echap bascule d'une page a l'autre.
addEventListener("keydown", e => {
  if(e.key === "Escape") aller(location.hash.slice(1) === "table" ? "accueil" : "table");
});

addEventListener("error", e => panne(e.error || e.message));

try {
  aller(location.hash.slice(1) || "accueil");
  document.getElementById("demarrage").classList.add("parti");
} catch(e) { panne(e); }
</script>
